name: Refresh profile dashboard

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: profile-dashboard-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate dashboard SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: momobiswas15-ops
          OUTPUT: assets/profile-stats.svg
        run: python3 scripts/generate_profile_stats.py

      - name: Generate public activity timeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: momobiswas15-ops
          OUTPUT: assets/profile-activity.svg
        run: python3 scripts/generate_profile_activity.py

      - name: Commit refreshed profile visuals only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/profile-activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile activity"
          git push
