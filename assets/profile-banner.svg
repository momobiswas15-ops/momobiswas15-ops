<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Md Mubaswir Biswas — aspiring software developer</title>
  <desc id="desc">A dark blue developer-themed banner with a subtle grid, gradient shapes, and the words Build, Learn, Improve.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#102A43"/>
      <stop offset="1" stop-color="#0B172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="40" x2="1120" y2="310" gradientUnits="userSpaceOnUse">
